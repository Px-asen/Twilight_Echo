packages:
  - packages/*

nodeLinker: hoisted

overrides:
  # Fix Axios request/proxy advisories and FTP listing-parser DoS in every runtime branch.
  axios: 1.20.0
  # Keep every Axios/runtime branch on the credential-stripping fixes.
  follow-redirects: 1.16.2
  basic-ftp: 6.2.1
  # Bound malformed MP4, EBML, ID3, APEv2 and DSF metadata parsing in all runtime branches.
  music-metadata: 11.16.0
  form-data: 4.0.6
  postcss: 8.5.26
  # Bound indexed source-map offsets and fix IPv4-mapped IPv6 proxy trust checks.
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  qs: 6.16.1
  node-forge: 1.4.1
  uuid: 11.1.1
  # GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8: nanoid 无限循环（经由 vue → postcss 引入）
  nanoid: 3.3.18
  # GHSA-mwp4-54f8-5fhr / GHSA-4xrf-jv44-h6hh / GHSA-22jq-vg5j-6vgg: ip-address SSRF/信任边界绕过（经由 socks → pac-proxy-agent 引入）
  # GHSA-j6r3-76f7-8jcv / GHSA-h3mg-xc3c-68pw: subnet-family checks and bounded diagnostics.
  # GHSA-rxp7-6hxx-x8q5: reject oversized zone identifiers before matching.
  ip-address: 10.7.4
  # GHSA-4qv8-2p9j-2685 / GHSA-xjj6-f33q-929c: bound EventSource parsing and content-encoding errors.
  # GHSA-f72v-6w45-q472: normalize SRI algorithm tokens in the Electron download branch.
  undici@6: 6.29.1
  undici@7: 7.30.1
  # Retain Express's major lines while fixing request limits and compressed-body trailing-byte DoS.
  # CVE-2026-12590 / GHSA-27r3-jxmh-p828.
  body-parser@1: 1.20.9
  body-parser@2: 2.4.0
  # electron-builder 需要识别 Electron 43 的 ABI（@electron/rebuild → node-abi）
  node-abi: 4.33.0

# discord-rpc presence uses IPC only (no OS protocol client). Its optional register-scheme
# fallback is an exotic native dependency for non-Electron runtimes, so omit it.
blockExoticSubdeps: true
ignoredOptionalDependencies:
  - register-scheme

patchedDependencies:
  '@neteasecloudmusicapienhanced/api@4.36.1': patches/@neteasecloudmusicapienhanced__api@4.36.1.patch
  '@phosphor-icons/web@2.1.2': patches/@phosphor-icons__web@2.1.2.patch
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch

# GHSA-jmr9-qjv8-65gv (extract-zip symlink 路径遍历): 上游 2.0.1 是最后一个发布版本，
# 没有修复版可升级；漏洞已由 patches/extract-zip@2.0.1.patch 在本地修复（拒收符号链接条目）。
# 上游一旦发布 >=2.0.2 就删除此例外并升级到修复版本。
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
