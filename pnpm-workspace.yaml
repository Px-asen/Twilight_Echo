packages:
  - packages/*

nodeLinker: hoisted

overrides:
  # Fix Axios request/proxy advisories and FTP listing-parser DoS in every runtime branch.
  axios: 1.20.0
  basic-ftp: 6.2.1
  # Strip array-form credentials safely on redirects and escape custom header names.
  follow-redirects: 1.16.1
  # Bound malformed MP4, EBML, ID3, APEv2 and DSF metadata parsing in all runtime branches.
  music-metadata: 11.16.0
  form-data: 4.0.6
  postcss: 8.5.26
  # Bound indexed source-map offsets and fix IPv4-mapped IPv6 proxy trust checks.
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  qs: 6.16.0
  uuid: 11.1.1
  # GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8: nanoid 无限循环（经由 vue → postcss 引入）
  nanoid: 3.3.18
  # GHSA-mwp4-54f8-5fhr / GHSA-4xrf-jv44-h6hh / GHSA-22jq-vg5j-6vgg: ip-address SSRF/信任边界绕过（经由 socks → pac-proxy-agent 引入）
  # GHSA-j6r3-76f7-8jcv / GHSA-h3mg-xc3c-68pw: subnet-family checks and bounded diagnostics.
  ip-address: 10.7.1
  # GHSA-3wwx-pv8p-q78v: fix both runtime and Electron download branches.
  undici@6.28.0: 6.28.1
  undici@7.29.0: 7.29.1
  # S8: CVE-2026-12590 — body-parser invalid `limit` 静默禁用请求体大小校验。
  # express@4 依赖 1.x 线，express@5 依赖 2.x 线，分别钉到修复版本。
  body-parser@1.20.5: 1.20.6
  body-parser@2.2.2: 2.3.0
  # electron-builder 需要识别 Electron 43 的 ABI（@electron/rebuild → node-abi）
  node-abi: 4.33.0

# discord-rpc presence uses IPC only (no OS protocol client). Its optional register-scheme
# fallback is an exotic native dependency for non-Electron runtimes, so omit it.
blockExoticSubdeps: true
ignoredOptionalDependencies:
  - register-scheme

patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  '@neteasecloudmusicapienhanced/api@4.35.1': patches/@neteasecloudmusicapienhanced__api@4.35.1.patch
  '@phosphor-icons/web@2.1.2': patches/@phosphor-icons__web@2.1.2.patch
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch

# GHSA-jmr9-qjv8-65gv (extract-zip symlink 路径遍历): 上游 2.0.1 是最后一个发布版本，
# 没有修复版可升级；漏洞已由 patches/extract-zip@2.0.1.patch 在本地修复（拒收符号链接条目）。
# 上游一旦发布 >=2.0.2 就删除此例外并升级到修复版本。
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # node-forge 1.4.0 has the verified PR #1152 backport in patchedDependencies.
    # No fixed npm release exists yet; remove this exception and patch when upgrading.
    # verify-install-policy and the production-audit integration tests require the patch.
    - GHSA-86w9-cpqp-85rv

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
