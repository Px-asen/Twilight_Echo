name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast Gate & Build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect dependency manifest changes
        id: dep-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            CHANGED="$(git diff --name-only FETCH_HEAD HEAD || true)"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo 'package.json')"
          fi
          if echo "$CHANGED" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|patches/)'; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install frozen dependency tree
        run: pnpm install --frozen-lockfile

      - name: Fast static, lint, and boundary gate
        run: node scripts/local-gate.cjs --fast --ci

      - name: Test release delivery policy
        run: pnpm run test:release-artifacts

      - name: Test production dependency audit gate
        run: pnpm run test:production-audit

      - name: Audit production dependency tree
        if: steps.dep-changes.outputs.audit == 'true'
        run: pnpm run audit:production -- --output "$RUNNER_TEMP/production-dependency-audit.json"

      - name: Upload production dependency audit
        if: always() && steps.dep-changes.outputs.audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: ${{ runner.temp }}/production-dependency-audit.json
          if-no-files-found: warn

      # Compile utility services and renderer once for all downstream product shards.
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Upload compiled application bundle
        uses: actions/upload-artifact@v4
        with:
          name: compiled-out
          path: out/
          include-hidden-files: true
          retention-days: 1

  product:
    name: Product Tests (${{ matrix.group }})
    needs: [preflight]
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group:
          - library-and-sources
          - playback-and-audio
          - application-and-boundaries
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install frozen dependency tree
        run: pnpm install --frozen-lockfile

      - name: Download compiled application bundle
        uses: actions/download-artifact@v4
        with:
          name: compiled-out
          path: out

      - name: Prepare Windows bridge compiler
        if: matrix.group == 'playback-and-audio'
        shell: pwsh
        run: |
          $compiler = (Get-Command g++.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = @(
              'C:\mingw64\bin\g++.exe',
              'C:\msys64\mingw64\bin\g++.exe',
              'C:\msys64\ucrt64\bin\g++.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Windows VST3 bridge tests require a MinGW C++ compiler' }
          $compilerBin = Split-Path -Parent $compiler
          "W64DEVKIT_ROOT=$(Split-Path -Parent $compilerBin)" >> $env:GITHUB_ENV
          $compilerBin >> $env:GITHUB_PATH
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows bridge compiler could not start' }

      - name: Test product behavior (${{ matrix.group }})
        # Avoid Windows user TEMP aliases giving Vite fixtures multiple module identities.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          pnpm run test:product --
          --group "${{ matrix.group }}"
          --report "$RUNNER_TEMP/product-quality-gate-${{ matrix.group }}.json"

      - name: Upload product quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-quality-gate-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/product-quality-gate-${{ matrix.group }}.json
            ${{ runner.temp }}/backdrop-filter-probe.png
          if-no-files-found: warn

      - name: Verify duplicate detection contract & Core window bridge
        if: matrix.group == 'application-and-boundaries'
        run: |
          pnpm run test:duplicate-detection-benchmark
          node --test scripts/core-window-bridge.test.cjs

      - name: Run isolated duplicate detection 10k benchmark
        id: duplicate-benchmark
        if: matrix.group == 'application-and-boundaries' && github.event_name == 'workflow_dispatch'
        run: >-
          pnpm run benchmark:duplicate-detection:ci --
          --output "$RUNNER_TEMP/duplicate-detection-benchmark.json"
          --manifest "$RUNNER_TEMP/duplicate-detection-benchmark.manifest.json"

      - name: Upload duplicate detection benchmark evidence
        if: always() && steps.duplicate-benchmark.outcome != 'skipped' && steps.duplicate-benchmark.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-detection-benchmark
          path: |
            ${{ runner.temp }}/duplicate-detection-benchmark.json
            ${{ runner.temp }}/duplicate-detection-benchmark.manifest.json
          if-no-files-found: warn

  native-audio:
    name: Native Audio (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure audio engine
        run: cmake -S audio-engine -B audio-engine/build/default -DTAE_BUILD_NAPI=OFF

      - name: Build audio engine
        # Performance gates need optimized code; native test targets keep assertions enabled.
        run: cmake --build audio-engine/build/default --config Release

      - name: Test audio engine
        run: ctest --test-dir audio-engine/build/default --output-on-failure --timeout 180 -C Release

      - name: Setup Node.js for cross-bitness ASIO checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate x86 ASIO bridge
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $env:TAE_ASIO_MSVC_INSTALL_ROOT = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          node scripts/run-asio-x86-bridge.cjs
          if ($LASTEXITCODE -ne 0) { throw 'ASIO cross-bitness validation failed' }

  required:
    name: Required Quality Gate
    if: always()
    needs: [preflight, product, native-audio]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Require every quality job
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PRODUCT_RESULT: ${{ needs.product.result }}
          NATIVE_AUDIO_RESULT: ${{ needs.native-audio.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$PRODUCT_RESULT" = "success"
          test "$NATIVE_AUDIO_RESULT" = "success"
