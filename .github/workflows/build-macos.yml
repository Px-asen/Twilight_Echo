name: Build macOS packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish the built packages to this release tag (for example v1.3.1). Leave empty to only build artifacts.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (dmg / zip)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            cmake_arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Build macOS audio engine (Node-API bridge)
        run: |
          cmake -S audio-engine -B audio-engine/build/default \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DTAE_BUILD_NAPI=ON \
            -DTAE_BUILD_TESTS=OFF
          cmake --build audio-engine/build/default --config Release
          test -f audio-engine/build/default/libtwilight-audio-engine.dylib
          test -f audio-engine/build/default/twilight_audio_node.node

      - name: Stage native audio engine
        run: node scripts/stage-audio-engine.cjs --build-dir audio-engine/build/default

      - name: Build and package macOS target
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm run build
          pnpm exec electron-builder --mac --${{ matrix.arch }} --config electron-builder.yml --publish never

      - name: Verify staged native engine in the packaged app
        run: |
          runtime_dir="$(find dist -path '*/TwilightEcho.app/Contents/Resources/audio-engine' -type d -print -quit)"
          test -n "$runtime_dir"
          test -f "$runtime_dir/libtwilight-audio-engine.dylib"
          test -f "$runtime_dir/twilight_audio_node.node"
          node scripts/macos-audio-runtime.cjs --runtime-dir "$runtime_dir"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: twilight-echo-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish macOS packages
    needs: macos
    # A tag push publishes automatically; manual runs must name an existing tag.
    if: needs.macos.result == 'success' && (github.event_name == 'push' || inputs.release_tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: twilight-echo-macos-*
          path: release-assets
          merge-multiple: true

      - name: Verify the release tag matches the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"

      - name: Write SHA-256 companion files
        run: node scripts/release-assets.cjs checksum release-assets

      - name: Publish the installers to the release
        # Draft releases are invisible to `/releases/tags`, so the helper resolves
        # the release id, replaces any older asset with the same name, and only
        # publishes once every platform attached its complete asset set.
        run: >-
          bash scripts/publish-release-assets.sh
          --tag "$RELEASE_TAG"
          --assets release-assets
          --platform macos

