appId: com.TwilightEcho.music
productName: TwilightEcho
directories:
  buildResources: build
asar: true
compression: maximum
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
icon: build/icon.png
# Single after-pack hook that dispatches to platform-specific scripts
# (scripts/after-pack.cjs -> after-pack-windows.cjs / after-pack-linux.cjs).
# Keeps Windows (rcedit icon/version injection) and Linux (native libs)
# packaging fully isolated.
afterPack: scripts/after-pack.cjs
files:
  - out/**
  - '!out/**/*.map'
  # Pure Node cannot read app.asar; its runtime is staged as a separate resource.
  - '!out/desktop-core/**'
  - package.json
  - THIRD-PARTY-NOTICES.txt
  - '!out/renderer/audio-engine/**'
  - '!out/renderer/plugins/**'
  - '!out/renderer/plugin-index/**'
  # Keep packaged Inter/Jakarta + MiSans subsets; strip legacy TTF/OTF/WOFF.
  - '!out/renderer/font/Alibaba-PuHuiTi-Medium.ttf'
  - '!out/renderer/font/Outfit-**'
  - '!out/renderer/font/**/*.{ttf,otf,woff}'
  - '!node_modules/**/{test,tests,__tests__,docs,doc,example,examples,benchmark,benchmarks}/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.md'
  - '!node_modules/@neteasecloudmusicapienhanced/api/public/**'
extraResources:
  - from: resources/automix-stems
    to: automix-stems
    filter:
      - worker.py
      - arrangement.py
      - probe.py
  - from: resources/remote
    to: remote
    filter:
      - '*.html'
      - '*.css'
      - remote.js
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/smtc
    to: smtc
    filter:
      - '**/*.ico'
  - from: resources/audio-engine
    to: audio-engine
    filter:
      - twilight-audio-engine.dll
      - libtwilight-audio-engine.so
      - libtwilight-audio-engine.dylib
      - libtwilight-soxr.dll
      - libtwilight-soxr.so
      - 'licenses/soxr-0.1.3/**/*'
      # Include the complete dependency closure staged by macos-audio-runtime.cjs.
      - '*.dylib'
      - twilight_audio_node.node
      - twilight_smtc_node.node
      - twilight-crash-helper.exe
      - twilight-crash-helper-x86.exe
      - native-build-identities.json
      - twilight-asio-helper.exe
      - twilight-asio-helper-x86.exe
      - twilight-vst3-host.exe
      - twilight-vst3-scanner.exe
      - audio-capabilities.json
      - release-capability-status.json
      - 'msvcp140*.dll'
      - 'vcruntime140*.dll'
      - libstdc++-6.dll
      - libgcc_s_seh-1.dll
      - libwinpthread-1.dll
      - 'libmcfgthread-*.dll'
      - 'libavcodec*'
      - 'libavformat*'
      - 'libavutil*'
      - 'libavfilter*'
      - 'libswresample*'
      - 'libswscale*'
      - 'avcodec-*.dll'
      - 'avformat-*.dll'
      - 'avutil-*.dll'
      - 'swresample-*.dll'
      - 'libebur128*'
      - 'libsoxr*'
      - 'libavdevice*'
      - 'libavresample*'
      - 'libssl.*.dylib'
      - 'libcrypto.*.dylib'
      - 'libx264.*.dylib'
      - 'libx265.*.dylib'
      - 'libvpx.*.dylib'
      - 'libopus.*.dylib'
      - 'libmp3lame.*.dylib'
      - 'libvorbis*.dylib'
      - 'libogg.*.dylib'
      - 'libaom.*.dylib'
      - 'libdav1d.*.dylib'
      - 'libsnappy.*.dylib'
      - 'liblzma.*.dylib'
      - automix-native/beat-this.tamg
      - automix-native/yamnet.tamg
      - automix-native/manifest.json
      - automix-native/Beat-This-LICENSE.txt
      - automix-native/YAMNet-LICENSE.txt
      - automix-native/Signalsmith-Stretch-LICENSE.txt
      - automix-native/Signalsmith-Linear-LICENSE.txt
  - from: resources/plugins
    to: plugins
    filter:
      - '**/*'
  - from: resources/plugin-index
    to: plugin-index
    filter:
      - '**/*'
win:
  # Windows packaging stages its pinned Node runtime before electron-builder.
  # macOS/Linux keep their existing Electron host and do not ship this runtime.
  extraResources:
    - from: out/desktop-core
      to: core-node
      filter:
        - '**/*'
        - '!**/*.map'
  executableName: TwilightEcho
  icon: build/icon.ico
  # Personal-project Windows packages are intentionally unsigned. Release integrity is provided
  # by the generated SHA-256 companion file and the fail-closed artifact checks.
  signAndEditExecutable: false
nsis:
  include: scripts/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  artifactName: ${name}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  maintainer: mrcwoods
  category: Audio
  icon: build/icon.png
  executableName: music
  synopsis: Modern desktop music player
  description: >
    Twilight Echo is a modern desktop music player for local collections,
    streaming exploration, and HiFi playback.
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
