<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Add independent, zero-centered RGB noise after the backdrop is composited.
       0.024 / 2 * 255 bounds each channel to approximately +/- 3 code values. -->
  <filter id="dither" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="17" result="noise" />
    <feColorMatrix
      in="noise"
      values="3 0 0 0 -1  0 3 0 0 -1  0 0 3 0 -1  0 0 0 0 1"
      result="grain"
    />
    <feComposite
      in="SourceGraphic"
      in2="grain"
      operator="arithmetic"
      k2="1"
      k3="0.024"
      k4="-0.012"
    />
  </filter>
</svg>
